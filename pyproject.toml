[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronologia"
version = "0.1.0"
description = "Visualisation de frises chronologiques à partir d'un CSV, avec export PDF vectoriel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.gui-scripts]
chronologia = "chronologia.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronologia = ["defaults/*.json", "translations/*.qm", "resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
