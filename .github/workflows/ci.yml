name: CI

# Vérifications uniquement : aucun paquet n'est construit ici (voir release.yml).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # chaque lundi : détecte les nouvelles failles des dépendances

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliothèques système de Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Installer
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts packaging
          ruff format --check src tests scripts packaging

      - name: Tests
        run: pytest

  security:
    name: Sécurité (analyse statique et dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Outils
        run: python -m pip install bandit pip-audit

      - name: Analyse statique (bandit)
        run: bandit -r src -ll

      - name: Failles connues des dépendances (pip-audit)
        run: |
          pip-audit -r packaging/requirements-build.txt --progress-spinner off
          pip-audit . --progress-spinner off
